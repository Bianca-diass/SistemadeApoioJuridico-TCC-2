<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documentos</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/style-advogado/clientes-adv.css">
    <link rel="stylesheet" href="../../css/style-advogado/documentos-adv.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <main class="conteudo">

        <header class="topoPagina">

            <div>

                <h1>Documentos</h1>

                <p>
                    Organize e visualize os documentos dos seus clientes.
                </p>

            </div>

            <a href="cadastro-documento-adv.html" class="btnNovo">

                <i class="fas fa-file-circle-plus"></i>

                Novo Documento

            </a>

        </header>


        <section class="cards-dashboard">

            <div class="card">

                <div class="icone azul">

                    <i class="fa-solid fa-folder"></i>

                </div>

                <div>

                    <span>Total de documentos</span>

                    <h2 id="totalDocumentos">0</h2>

                </div>

            </div>


            <div class="card">

                <div class="icone vermelho">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                </div>

                <div>

                    <span>Pendentes</span>

                    <h2 id="totalPendentes">0</h2>

                </div>

            </div>


            <div class="card">

                <div class="icone verde">

                    <i class="fa-solid fa-circle-check"></i>

                </div>

                <div>

                    <span>Aprovados</span>

                    <h2 id="totalAprovados">0</h2>

                </div>

            </div>

        </section>


        <div class="barra-pesquisa">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="pesquisarDocumento"
                placeholder="Buscar documento...">

        </div>


        <!-- FILTRO POR CLIENTE -->

        <div class="filtro-cliente">

            <select id="filtroCliente">

                <option value="">
                    Todos os clientes
                </option>

            </select>

        </div>


        <section class="tabelaClientes">

            <table>

                <thead>

                    <tr>

                        <th>Documento</th>

                        <th>Tipo</th>

                        <th>Cliente</th>

                        <th>Processo</th>

                        <th>Data de envio</th>

                        <th>Status</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaDocumentos">

                </tbody>

            </table>

        </section>

    </main>

</div>


<!-- MODAL VISUALIZAR DOCUMENTO -->

<div id="modalDocumento" class="modal-documento">

    <div class="conteudo-modal cardInformacoes">

        <div class="tituloCard">

            <i class="fa-solid fa-file-lines"></i>

            <h2>
                Detalhes do documento
            </h2>

        </div>

        <div class="informacoesGrid">

            <div class="informacao nome">

                <label>Documento</label>

                <span id="modalTitulo"></span>

            </div>

            <div class="informacao">

                <label>Tipo</label>

                <span id="modalTipo"></span>

            </div>

            <div class="informacao">

                <label>Cliente</label>

                <span id="modalCliente"></span>

            </div>

            <div class="informacao">

                <label>Processo</label>

                <span id="modalProcesso"></span>

            </div>

            <div class="informacao">

                <label>Data de envio</label>

                <span id="modalData"></span>

            </div>

            <div class="informacao">

                <label>Status</label>

                <span id="modalStatus"></span>

            </div>

            <div class="informacao nome">

                <label>Descrição</label>

                <span id="modalDescricao" class="informacao-descricao"></span>

            </div>

        </div>

        <div class="botoesCliente">

            <button
                class="botaoVoltar"
                id="fecharModal">

                Fechar

            </button>

        </div>

    </div>

</div>


<script
    type="module"
    src="../../js/pages/advogado/documentos.js">
</script>

</body>

</html>
