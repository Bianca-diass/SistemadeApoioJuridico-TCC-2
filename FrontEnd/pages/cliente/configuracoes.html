<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurações</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/style-cliente/configuracoes-cliente.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- MENU -->

    <aside class="sidebar">

        <h2>Área do Cliente</h2>

        <nav>

            <a href="dashboard.html">
                <i class="fas fa-house"></i>
                Dashboard
            </a>

            <a href="agenda.html">
                <i class="fas fa-calendar-days"></i>
                Agenda
            </a>

            <a href="configuracoes.html" class="ativo">
                <i class="fas fa-gear"></i>
                Configurações
            </a>

        </nav>

    </aside>

    <!-- CONTEÚDO -->

    <main class="conteudo">

        <header class="topoPagina">

            <h1>Configurações</h1>

            <p>Gerencie suas informações pessoais.</p>

        </header>

        <section class="painel">

            <h2>Dados do Cliente</h2>

            <form>

                <div class="campo">
                    <label>Nome Completo</label>
                    <input type="text" value="João da Silva">
                </div>

                <div class="campo">
                    <label>E-mail</label>
                    <input type="email" value="joao@email.com">
                </div>

                <div class="campo">
                    <label>Telefone</label>
                    <input type="text" value="(67) 99999-9999">
                </div>

                <div class="campo">
                    <label>Nova Senha</label>
                    <input type="password" placeholder="********">
                </div>

                <button type="submit">Salvar Alterações</button>

            </form>

        </section>

    </main>

</div>

</body>

</html>
