<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editar Cliente</title>

<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/style-advogado/editar-clientes-adv.css">

</head>


<body>


<div class="container">


<main class="conteudo">


<header class="topoPagina">

<h1>Editar Cliente</h1>

<p>Atualize os dados do cliente.</p>

</header>



<section class="cardConfiguracao">


<div class="grupo">

<label>Nome</label>

<input id="nome" type="text">

</div>



<div class="grupo">

<label>Email</label>

<input id="email" type="email">

</div>



<div class="grupo">

<label>Telefone</label>

<input id="telefone" type="text">

</div>



<button id="salvar">

Salvar Alterações

</button>


</section>


</main>


</div>



<script type="module">


import { clienteController } 
from "../../js/controllers/clienteController.js";



const id = new URLSearchParams(window.location.search).get("id");



const nome = document.getElementById("nome");
const email = document.getElementById("email");
const telefone = document.getElementById("telefone");



try {

    const cliente = await clienteController.buscarCliente(id);

    if (!cliente) {

        alert("Cliente não encontrado.");

        window.location.href = "clientes-adv.html";

    } else {

        nome.value = cliente.nome || "";

        email.value = cliente.email || "";

        telefone.value = cliente.telefone || "";

    }

} catch (erro) {

    console.error("Erro ao buscar cliente:", erro);

    alert("Erro ao carregar os dados do cliente.");

}



document.getElementById("salvar").onclick = async ()=>{

try {

    await clienteController.editarCliente(id,{

    nome:nome.value,

    email:email.value,

    telefone:telefone.value

    });



    alert("Cliente atualizado com sucesso.");


    window.location.href="clientes-adv.html"

} catch (erro) {

    console.error("Erro ao salvar cliente:", erro);

    alert(erro.message || "Erro ao salvar as alterações.");

}

};
</script>


</body>

</html>
