<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Cliente</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/style-cliente/cadastro-cliente-login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">

            <i class="fas fa-address-card"></i>

            <h1>Criar Conta</h1>

            <p>Cadastre-se para acessar o sistema.</p>

        </div>

        <form id="formCadastro">

            <div class="campo">

                <label>Nome Completo</label>

                <input
                    type="text"
                    id="nome"
                    required
                    placeholder="Digite seu nome">

            </div>

            <div class="campo">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="Digite seu e-mail">

            </div>

            <div class="campo">

                <label>Telefone</label>

                <input
                    type="text"
                    id="telefone"
                    placeholder="(67) 99999-9999">

            </div>

            <div class="campo">

                <label>Senha</label>

                <input
                    type="password"
                    id="senha"
                    required
                    minlength="6"
                    placeholder="Mínimo 6 caracteres">

            </div>

            <button type="submit">

                Criar Conta

            </button>

        </form>

        <div class="rodape">

            <p>Já possui conta?</p>

            <a href="login.html">

                Fazer Login

            </a>

        </div>

    </div>

</div>

<script type="module">

import { authController } from "../../js/controllers/authController.js";

const form = document.getElementById("formCadastro");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const telefone = document.getElementById("telefone").value;
    const senha = document.getElementById("senha").value;

    try {

        await authController.cadastrar(email, senha, {
            nome,
            telefone,
            tipo: "cliente"
        });

        alert("Cadastro realizado com sucesso!");
        window.location.href = "login.html";

    } catch (error) {
        alert(error.message);
    }

});

</script>

</body>

</html>
