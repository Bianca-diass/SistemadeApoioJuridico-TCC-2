<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Advogado - Sistema Jurídico</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/style-advogado/login-advogado.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">

            <i class="fas fa-scale-balanced"></i>

            <h1>Criar Conta</h1>

            <p>Cadastre seu acesso ao Sistema Jurídico</p>

        </div>


        <form id="formCadastro">

            <!-- NOME -->

            <div class="campo">

                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required>

            </div>


            <!-- OAB -->

            <div class="campo">

                <label for="oab">OAB</label>

                <input
                    type="text"
                    id="oab"
                    placeholder="Digite o número da OAB"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="campo">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required>

            </div>


            <!-- SENHA -->

            <div class="campo">

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                    minlength="6">

            </div>


            <!-- CONFIRMAR SENHA -->

            <div class="campo">

                <label for="confirmarSenha">Confirmar senha</label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    required
                    minlength="6">

            </div>


            <!-- BOTÃO -->

            <button type="submit">

                <i class="fas fa-user-plus"></i>

                Cadastrar

            </button>

        </form>


        <!-- VOLTAR -->

        <div class="rodape">

            <p>Já possui uma conta?</p>

            <button
                type="button"
                id="btnVoltar">

                Voltar para Login

            </button>

        </div>

    </div>

</div>


<script>

const formCadastro = document.getElementById("formCadastro");

const btnVoltar = document.getElementById("btnVoltar");


// ==========================================
// CADASTRAR ADVOGADO
// ==========================================

formCadastro.addEventListener("submit", async (e) => {

    e.preventDefault();


    const nome = document.getElementById("nome").value.trim();

    const oab = document.getElementById("oab").value.trim();

    const email = document.getElementById("email").value.trim();

    const senha = document.getElementById("senha").value;

    const confirmarSenha =
        document.getElementById("confirmarSenha").value;


    // ==========================================
    // VERIFICAR SENHAS
    // ==========================================

    if (senha !== confirmarSenha) {

        alert("As senhas não são iguais.");

        return;

    }


    // ==========================================
    // TAMANHO DA SENHA
    // ==========================================

    if (senha.length < 6) {

        alert("A senha deve possuir pelo menos 6 caracteres.");

        return;

    }


    try {

        const resposta = await fetch(
            "http://localhost:3000/auth/register",
            {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    nome,
                    oab,
                    email,
                    senha

                })

            }
        );


        const dados = await resposta.json();


        // ==========================================
        // ERRO
        // ==========================================

        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                "Não foi possível cadastrar o advogado."
            );

        }


        // ==========================================
        // SUCESSO
        // ==========================================

        alert("Advogado cadastrado com sucesso!");


        // Volta para o login

        window.location.href = "login-adv.html";


    } catch (erro) {

        console.error("Erro ao cadastrar advogado:", erro);

        alert("Erro: " + erro.message);

    }

});


// ==========================================
// VOLTAR PARA LOGIN
// ==========================================

btnVoltar.addEventListener("click", () => {

    window.location.href = "login-adv.html";

});

</script>

</body>

</html>
